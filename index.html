<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OmniSearch</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--mute:#5d6673;--line:#e1e5ea;--accent:#2f5bff;--at:#fff;--chip:#e9eeff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--card:#181d25;--text:#eef1f5;--mute:#9aa4b2;--line:#2a313c;--accent:#6f8cff;--at:#0f1217;--chip:#222b45}}
:root[data-theme="dark"]{--bg:#0f1217;--card:#181d25;--text:#eef1f5;--mute:#9aa4b2;--line:#2a313c;--accent:#6f8cff;--at:#0f1217;--chip:#222b45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}h1{font-size:24px;margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;background:var(--card);color:var(--mute);border:1px solid var(--line);padding:9px;font-weight:600}
.tabs button.on{background:var(--chip);color:var(--accent);border-color:var(--accent)}
input,select{min-width:0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;width:100%}
button{border:0;border-radius:12px;background:var(--accent);color:var(--at);font-weight:600;padding:12px 16px;font-size:15px;cursor:pointer}
.row{display:flex;gap:8px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:999px;font-size:14px;font-weight:500}
.chip.on{background:var(--chip);border-color:var(--accent);color:var(--accent)}
.label{font-size:12px;color:var(--mute);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;text-decoration:none;color:var(--text)}
.card b{display:block}.card span{color:var(--mute);font-size:14px}.go{color:var(--accent);font-weight:600;white-space:nowrap}
.note{background:var(--chip);border-radius:14px;padding:12px;font-size:13px;margin-top:14px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fl label{font-size:12px;color:var(--mute)}
.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line);width:100%}
</style></head><body><main>
<h1>OmniSearch</h1><div id="tabs"></div><div id="v"></div>
</main><script>
const S={amazon:["Amazon","https://www.amazon.com/s?k={q}"],ebay:["eBay","https://www.ebay.com/sch/i.html?_nkw={q}"],gshop:["Google Shopping","https://www.google.com/search?tbm=shop&q={q}"],fbm:["Facebook Marketplace","https://www.facebook.com/marketplace/search/?query={q}"],craig:["Craigslist","https://www.craigslist.org/search/sss?query={q}"],gflights:["Google Flights","https://www.google.com/travel/flights?q={q}"],ghotels:["Google Hotels","https://www.google.com/travel/search?q={q}"],zillow:["Zillow","https://www.zillow.com/homes/{q}_rb/"],apts:["Apartments.com","https://www.apartments.com/{q}/"],cars:["Cars.com","https://www.cars.com/shopping/results/?keyword={q}"],cargurus:["CarGurus","https://www.cargurus.com/search?searchText={q}"],instacart:["Instacart","https://www.instacart.com/store/s?k={q}"],expedia:["Expedia Hotels","https://www.expedia.com/Hotel-Search?destination={q}"],carfax:["Carfax (history by VIN)","https://www.carfax.com/"],heb:["H-E-B","https://www.heb.com/search?q={q}"],walmart:["Walmart","https://www.walmart.com/search?q={q}"],target:["Target","https://www.target.com/s?searchTerm={q}"],offerup:["OfferUp","https://offerup.com/search?q={q}"],mercari:["Mercari","https://www.mercari.com/search/?keyword={q}"],etsy:["Etsy","https://www.etsy.com/search?q={q}"],bestbuy:["Best Buy","https://www.bestbuy.com/site/searchpage.jsp?st={q}"],homedepot:["Home Depot","https://www.homedepot.com/s/{q}"],costco:["Costco","https://www.costco.com/CatalogSearch?keyword={q}"],newegg:["Newegg","https://www.newegg.com/p/pl?d={q}"],booking:["Booking.com","https://www.booking.com/searchresults.html?ss={q}"],airbnb:["Airbnb","https://www.airbnb.com/s/{q}/homes"],autotrader:["Autotrader","https://www.autotrader.com/cars-for-sale/all-cars?keywordPhrases={q}"],carmax:["CarMax","https://www.carmax.com/cars?search={q}"],kroger:["Kroger","https://www.kroger.com/search?query={q}"],aldi:["ALDI","https://www.aldi.us/results?q={q}"]};
// traits: [price, quality, local/fast], 0-1. Heuristic until your AI scores real listings.
const T={ebay:[.8,.5,.3],amazon:[.6,.7,.2],gshop:[.7,.6,.2],walmart:[.8,.5,.4],target:[.6,.6,.4],bestbuy:[.5,.8,.5],newegg:[.7,.6,.1],homedepot:[.5,.7,.5],costco:[.8,.7,.4],etsy:[.3,.8,.1],mercari:[.8,.4,.2],offerup:[.8,.4,.9],fbm:[.9,.3,.9],craig:[.8,.3,.9],cargurus:[.7,.7,.5],carmax:[.4,.8,.6],carfax:[.1,.9,.1],heb:[.6,.7,.9],kroger:[.6,.6,.8],aldi:[.9,.5,.7],instacart:[.3,.6,.6]};
const C={products:{n:"Products",k:"laptop phone shoes sneakers headphones tv camera book textbook chair desk jacket watch console monitor keyboard gift used cheap",s:["gshop","amazon","ebay","walmart","target","bestbuy","newegg","homedepot","costco","etsy","mercari","offerup","fbm","craig"]},flights:{n:"Flights",k:"flight flights fly airline ticket tickets airport roundtrip nonstop",s:["gflights"]},hotels:{n:"Hotels",k:"hotel hotels stay airbnb resort lodging",s:["ghotels","expedia","booking","airbnb"]},housing:{n:"Housing",k:"apartment apartments house houses rent rental lease condo studio bedroom home homes",s:["apts","zillow","craig"]},cars:{n:"Cars",k:"car cars truck suv sedan honda toyota ford tesla vehicle",s:["cars","cargurus","autotrader","carmax","carfax","fbm"]},groceries:{n:"Groceries",k:"grocery groceries milk eggs bread chicken rice produce snacks cereal pasta",s:["heb","kroger","aldi","instacart","walmart","target","costco"]}};
const mx={id:"max",l:"Max price $",n:1,f:v=>v?"under $"+v:""};
const F={products:[{id:"cond",l:"Condition",o:["Any","New","Used"],f:v=>v=="Any"?"":v.toLowerCase()},mx],flights:[{id:"stop",l:"Stops",o:["Any","Nonstop"],f:v=>v=="Any"?"":"nonstop"},{id:"cab",l:"Cabin",o:["Economy","Business"],f:v=>v=="Business"?"business class":""}],hotels:[{id:"star",l:"Stars",o:["Any","3+","4+","5"],f:v=>v=="Any"?"":v.replace("+","")+" star"},{id:"max",l:"Max $/night",n:1,f:mx.f}],housing:[{id:"bd",l:"Beds",o:["Any","Studio","1","2","3"],f:v=>v=="Any"?"":v=="Studio"?"studio":v+" bedroom"},{id:"max",l:"Max rent $",n:1,f:mx.f}],cars:[mx,{id:"mi",l:"Mileage",o:["Any","<60k","<100k"],f:v=>v=="Any"?"":"under "+v.slice(1)+" miles"}],groceries:[{id:"t",l:"Type",o:["Any","Organic","Store brand"],f:v=>v=="Any"?"":v.toLowerCase()}]};
const I={laptops:["Laptops",["laptop for college","gaming laptop deals","used macbook"]],sneakers:["Sneakers",["running shoes","used jordans","white sneakers"]],cars:["Cars",["used honda civic","used toyota camry","electric car"]],housing:["Housing",["studio apartment for rent","2 bedroom apartment","roommate friendly apartment"]],groceries:["Groceries",["eggs and milk","organic chicken","cheap snacks"]],travel:["Travel",["flights to Austin","hotel in Miami","weekend getaway"]],gaming:["Gaming",["ps5 console","gaming monitor","used nintendo switch"]],furniture:["Furniture",["desk for dorm","office chair","used couch"]]};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let U=ld("u"),P=ld("p")||{int:[],pref:0},tab="s",st={q:"",cats:[],fv:{},all:false};
function route(q){const w=q.toLowerCase().split(/\W+/);const h=Object.entries(C).map(([i,c])=>[i,c.k.split(" ").filter(k=>w.includes(k)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);return h.length?h:["products"]}
const url=(id,q)=>S[id][1].replace("{q}",encodeURIComponent(q).replace(/%20/g,id=="zillow"||id=="apts"?"-":"%20"));
function extra(){const c=st.cats[0],v=st.fv[c]||{};return(F[c]||[]).map(f=>f.f(v[f.id]??(f.o?f.o[0]:""))).filter(Boolean).join(" ")}
const full=()=>(st.q+" "+extra()).trim();
function head(){if(!U){$("tabs").innerHTML="";return}$("tabs").innerHTML='<div class="tabs">'+[["s","Search"],["f","For you"],["p","Profile"]].map(([i,n])=>`<button data-t="${i}" class="${tab==i?"on":""}">${n}</button>`).join("")+"</div>";$("tabs").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;view()})}
function view(){head();if(!U)return auth();({s:search,f:foryou,p:profile})[tab]()}
function auth(){$("v").innerHTML=`<div class="label">Sign in</div><input id="n" placeholder="Name"><div style="height:8px"></div><input id="e" type="email" placeholder="Email"><div style="height:10px"></div><button id="si" style="width:100%">Continue</button><div class="note">Prototype sign-in: your profile is saved only in this browser. Real accounts, passwords and sync need a backend (next step).</div>`;$("si").onclick=()=>{const n=$("n").value.trim(),e=$("e").value.trim();if(!n||!e)return;U={n,e};sv("u",U);view()}}
function search(){$("v").innerHTML=`<div class="row"><input id="q" placeholder="cheap used laptop for college" value="${esc(st.q)}"><button id="go">Search</button></div><div id="out"></div>`;const run=()=>{const q=$("q").value.trim();if(!q)return;st.q=q;st.cats=route(q);st.fv={};st.all=false;res()};$("go").onclick=run;$("q").onkeydown=e=>{if(e.key=="Enter")run()};window.runQ=run;if(st.q)res()}
function res(){const c=st.cats[0],q=full(),idx=P.pref,sc=id=>(T[id]||[.5,.5,.5])[idx];
const ids=[...new Set(st.cats.flatMap(k=>C[k].s))].sort((a,b)=>sc(b)-sc(a)),show=st.all?ids:ids.slice(0,4);
const fv=st.fv[c]||{};
const fl=(F[c]||[]).map(f=>f.o?`<div><label>${f.l}</label><select data-f="${f.id}">${f.o.map(o=>`<option ${(fv[f.id]??f.o[0])==o?"selected":""}>${o}</option>`).join("")}</select></div>`:`<div><label>${f.l}</label><input data-f="${f.id}" type="number" inputmode="numeric" value="${fv[f.id]||""}" placeholder="Any"></div>`).join("");
$("out").innerHTML=`<div class="label">Category (tap to change)</div><div class="chips">${Object.entries(C).map(([i,x])=>`<button class="chip ${st.cats.includes(i)?"on":""}" data-c="${i}">${x.n}</button>`).join("")}</div>
<div class="label">Filters for ${C[c].n.toLowerCase()}</div><div class="fl">${fl}</div>
<div class="label">Optimize for</div><div class="chips">${["Cheapest","Best quality","Local & fast"].map((n,i)=>`<button class="chip ${P.pref==i?"on":""}" data-p="${i}">${n}</button>`).join("")}</div>
<div class="label">Searching “${esc(q)}”</div>${show.map(id=>`<a class="card" href="${url(id,q)}" target="_blank" rel="noopener"><div><b>${S[id][0]}</b><span>Open results</span></div><div class="go">Open ›</div></a>`).join("")}
${ids.length>4?`<button class="ghost" id="all">${st.all?"Show top 4":"Show all "+ids.length+" sources"}</button>`:""}
<div class="note">Sources are ordered by a simple preference heuristic, not your AI yet. Filters are added to the search text. Real ranking needs listing data (eBay API next).</div>`;
$("out").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const k=b.dataset.c;st.cats=st.cats.includes(k)?st.cats.filter(x=>x!=k):[...st.cats,k];if(!st.cats.length)st.cats=[k];res()});
$("out").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{P.pref=+b.dataset.p;sv("p",P);res()});
$("out").querySelectorAll("[data-f]").forEach(el=>el.onchange=()=>{(st.fv[c]=st.fv[c]||{})[el.dataset.f]=el.value;res()});
const a=$("all");if(a)a.onclick=()=>{st.all=!st.all;res()}}
function foryou(){const it=P.int;$("v").innerHTML=it.length?`<div class="label">Suggested for ${esc(U.n)}</div>`+it.map(k=>`<div class="label">${I[k][0]}</div>`+I[k][1].map(q=>`<div class="card" data-q="${esc(q)}" style="cursor:pointer"><div><b>${esc(q)}</b><span>Tap to search</span></div><div class="go">Search ›</div></div>`).join("")).join("")+`<div class="note">These are suggested searches from your interests. Live listing cards need data from APIs (eBay first).</div>`:`<div class="note">Pick interests in the Profile tab to fill this dashboard.</div>`;$("v").querySelectorAll("[data-q]").forEach(c=>c.onclick=()=>{st.q=c.dataset.q;st.cats=route(st.q);st.fv={};st.all=false;tab="s";view()})}
function profile(){$("v").innerHTML=`<div class="label">Account</div><div class="card"><div><b>${esc(U.n)}</b><span>${esc(U.e)}</span></div></div><div class="label">Interests</div><div class="chips">${Object.entries(I).map(([k,x])=>`<button class="chip ${P.int.includes(k)?"on":""}" data-i="${k}">${x[0]}</button>`).join("")}</div><button class="ghost" id="so">Sign out</button><div class="note">Payments: none yet. In a redirect model users pay on the seller’s site, so card payment is only needed if you sell a subscription.</div>`;
$("v").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const k=b.dataset.i;P.int=P.int.includes(k)?P.int.filter(x=>x!=k):[...P.int,k];sv("p",P);profile()});
$("so").onclick=()=>{U=null;sv("u",null);view()}}
view();
</script></body></html>
